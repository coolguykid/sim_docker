x-region-build: &region-build
  context: .
  dockerfile: region_image/Dockerfile

x-region-health: &region-health
  test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} && curl -fsS http://127.0.0.1:8080/health >/dev/null"]
  interval: 3s
  timeout: 5s
  retries: 80
  start_period: 15s

x-region-environment: &region-environment
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  REGION_DT_PORT: 8080
  REGION_DATA_DIR: /region_data/current
  REGION_OUTPUT_DIR: /app/data

services:
  region-dt-01:
    build: *region-build
    image: airway-region-dt:dev
    container_name: region-dt-01
    hostname: region-dt-01
    restart: unless-stopped
    environment:
      <<: *region-environment
      POSTGRES_DB: region_01
      REGION_ID: 1
      REGION_PUBLIC_URL: http://region-dt-01:8080
    ports: ["15431:5432", "18101:8080"]
    volumes:
      - region-01-pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - ./region_data/region_001:/region_data/current:ro
      - ./output/region_01:/app/data
    healthcheck: *region-health

  region-dt-02:
